[package]
name = "bridgekit"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Sean Shaffer"]
description = "Verified C# and Rust binding generator for the DLL collection, generated from the kits' own headers"
license = "MIT"
repository = "https://github.com/SeanShaffer88/BridgeKit"
keywords = ["windows", "ffi", "codegen"]
categories = ["development-tools", "command-line-utilities"]

# BridgeKit is a CLI tool (like GoldenKit), not a DLL: a [lib] core with
# the header parser, the two generators and the PE export checker, and
# one thin [[bin]] over it. There is no cdylib/FFI surface to reshape.
[lib]
name = "bridgekit"
path = "src/lib.rs"

[[bin]]
name = "bridgekit"
path = "src/main.rs"

# Zero dependencies. Adding one requires a written justification in the
# PR — the header grammar and the PE export format are both small,
# stable, and fully implemented below with std only.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
