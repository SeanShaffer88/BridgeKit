# Release workflow — builds the x64 CLI package and attaches it to
# the GitHub Release for the pushed version tag. The release itself
# (tag + notes) is created in the GitHub web UI; this workflow only
# builds and uploads the zip. Binaries are unsigned.
#
# Adapted from the collection's canonical DLL release.yml: BridgeKit
# is a tool, not a DLL, so the zip carries bridgekit.exe + README +
# LICENSE instead of the DLL / import lib / header set (the change is
# recorded in docs/PARITY.md).
name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package x64 CLI zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $stage = "dist/BridgeKit-$ver-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/release/bridgekit.exe" $stage
          Copy-Item LICENSE $stage
          Copy-Item README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/BridgeKit-$ver-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
